##########  JTAG probe:
source [find interface/jlink.cfg]

#adapter serial 260113755

transport select jtag
adapter speed 450
reset_config trst_and_srst
#reset_config none
jtag_ntrst_delay 100


##########  TAP configuration:

# TDI input ca55->m52->m3-> TDO output


#jtag newtap synaprot m3 -irlen 4 -expected-id 0x4ba06477
jtag newtap nexus m52 -irlen 4 -expected-id 0x4ba06477
#jtag newtap soc ca55 -irlen 4 -expected-id 0x4ba06477

#dap create m3.dap -chain-position synaprot.m3 -adiv6
dap create m52.dap -chain-position nexus.m52 -adiv6
#dap create ca55.dap -chain-position soc.ca55 -adiv6

#target create m3 cortex_m -endian little -dap m3.dap -ap-num 0
target create m52 cortex_m -endian little -dap m52.dap -ap-num 0x10000
target create m52.mem_ap mem_ap -dap m52.dap -ap-num 0x30000

#cti create cti.0 -dap ca55.dap -baseaddr 0x020000 -ap-num 0x10000 
#cti create cti.1 -dap ca55.dap -baseaddr 0x120000 -ap-num 0x10000 

#target create ca55.mem_ap mem_ap -dap ca55.dap -ap-num 0x20000

#target create ca55.0 aarch64 -endian little -dbgbase 0x010000 -dap ca55.dap -ap-num 0x10000 -coreid 0 -cti cti.0
#target create ca55.1 aarch64 -endian little -dbgbase 0x110000 -dap ca55.dap -ap-num 0x10000 -coreid 1 -cti cti.1

#targets m3

bindto 0.0.0.0
